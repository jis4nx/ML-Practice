    { name = "jis4nx", email = "jis4nx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
